<title>PakSwap Studio</title>
<meta name="description" content="3D car configurator for Pakistani cars: engine swaps with live engine sound, paint, body kits, wheels, tuning and full performance specs.">
<meta name="theme-color" content="#05070b">
<style>
{{FONTS_CSS}}
:root {
  /* Layout: the 3D stage fills the window; the interface floats over it as glass panels -
     car rack on the left, tuning desk on the right, instruments along the bottom.
     Phones: stage on top, tabs below. */
  --bg: #05070b;
  --panel: #0e1219;
  --panel-2: #151b26;
  --panel-3: #1f2735;
  --glass: rgba(10, 14, 21, 0.56);
  --glass-hi: rgba(18, 24, 34, 0.74);
  --card: rgba(255, 255, 255, 0.045);
  --card-hi: rgba(255, 255, 255, 0.08);
  --line: rgba(255, 255, 255, 0.09);
  --line-2: rgba(255, 255, 255, 0.17);
  --fg: #eaf1fb;
  --muted: #93a1b7;
  --faint: #5d6a7f;
  --accent: #2ee6ff;
  --accent-rgb: 46, 230, 255;
  --accent-ink: #02161b;
  --accent-2: #ffb224;
  --accent-2-rgb: 255, 178, 36;
  --stock: #8fa3bd;
  --good: #3fe391;
  --bad: #ff5d6c;
  --warn: #ffb224;
  --grid: rgba(234, 241, 251, 0.09);
  --plate: #f6f5ef;
  --plate-ink: #111111;
  --plate-green: #01633a;
  --font-display: "Chakra Petch", "Bahnschrift", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Archivo", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 14px;
  --r-sm: 10px;
  --r-xs: 7px;
  --gap: 12px;
  --top-h: 58px;
  --rack-w: 300px;
  --desk-w: 404px;
  --blur: blur(22px) saturate(165%);
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.35);
  --glow: 0 0 0 1px rgba(var(--accent-rgb), 0.55), 0 0 22px rgba(var(--accent-rgb), 0.22);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow: hidden; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: rgba(var(--accent-rgb), 0.35); }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------------- glass */
.glass { background: linear-gradient(150deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0) 38%), var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--line); box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.09); }
/* a bright studio behind the panels needs denser glass to keep text readable */
body.day { --glass: rgba(11, 15, 22, 0.8); --glass-hi: rgba(16, 21, 30, 0.88); }
/* "solid" interface: no live blur. Used on slow GPUs and when the user asks for it. */
body.solid { --glass: rgba(11, 14, 20, 0.94); --glass-hi: rgba(16, 20, 28, 0.97); --blur: none; }
body.solid .glass, body.solid .seg, body.solid .car-title, body.solid .dv-panel, body.solid .dv-btn, body.solid .dv-angle { -webkit-backdrop-filter: none; backdrop-filter: none; }

.app { height: 100%; }
.stage-wrap { position: fixed; inset: 0; background: #05070b; }
.stage { position: absolute; inset: 0; }
.stage.drop::after { content: "Drop the 3D model file to load it"; position: absolute; inset: 16px; border: 2px dashed var(--accent); border-radius: var(--r); display: grid; place-items: center; color: var(--accent); font-family: var(--font-display); font-size: 18px; background: rgba(5, 7, 11, 0.6); pointer-events: none; z-index: 30; }
.viewport { position: absolute; inset: 0; }
.viewport canvas { display: block; touch-action: none; outline: none; }
/* soft edge darkening so the panels read against any backdrop */
.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(3, 5, 8, 0.55) 100%); }
body.day .vignette { opacity: 0.35; }

/* ---------------- top bar */
.top { position: fixed; z-index: 6; top: var(--gap); left: var(--gap); right: var(--gap); height: var(--top-h); border-radius: 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 10px 0 14px; }
.top::after { content: ""; position: absolute; left: 22px; right: 22px; bottom: -1px; height: 1px; background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb), 0.85) 18%, rgba(var(--accent-2-rgb), 0.8) 50%, rgba(var(--accent-rgb), 0.85) 82%, transparent); opacity: 0.7; pointer-events: none; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo-plate { display: flex; align-items: stretch; background: var(--plate); color: var(--plate-ink); border-radius: 6px; border: 2px solid #15171a; box-shadow: 0 0 0 1.5px var(--plate), 0 4px 14px rgba(0, 0, 0, 0.4); font-family: var(--font-display); font-weight: 700; letter-spacing: 0.04em; line-height: 1; height: 30px; overflow: hidden; flex: none; }
.logo-plate .pk { background: var(--plate-green); color: #fff; font-size: 9.5px; display: grid; place-items: center; padding: 0 6px; }
.logo-plate b { padding: 0 2px 0 8px; display: grid; place-items: center; font-size: 16px; }
.logo-plate i { font-style: normal; padding: 0 8px 0 2px; display: grid; place-items: center; font-size: 16px; color: #b5121b; }
.brand-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.brand-text strong { font-family: var(--font-display); font-size: 15.5px; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
.brand-text span { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; gap: 6px; flex-wrap: nowrap; align-items: center; }

/* ---------------- buttons */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: var(--r-sm); padding: 8px 12px; font-family: var(--font-display); font-size: 13px; font-weight: 600; letter-spacing: 0.03em; line-height: 1.1; transition: background .16s, border-color .16s, box-shadow .16s, color .16s, transform .08s; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--card-hi); border-color: var(--line-2); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.primary { background: linear-gradient(180deg, #5cecff, var(--accent)); color: var(--accent-ink); border-color: transparent; box-shadow: 0 0 0 1px rgba(var(--accent-rgb), 0.5), 0 6px 22px rgba(var(--accent-rgb), 0.28); }
.btn.primary:hover { background: linear-gradient(180deg, #8af2ff, #4feaff); box-shadow: 0 0 0 1px rgba(var(--accent-rgb), 0.7), 0 8px 28px rgba(var(--accent-rgb), 0.4); }
.btn.ghost { background: transparent; }
.btn.icon { padding: 8px; }
.btn[aria-pressed="true"] { background: rgba(var(--accent-rgb), 0.14); border-color: rgba(var(--accent-rgb), 0.6); color: var(--accent); }
/* the Drive button: amber, cut corners like a start button */
.btn.drive { background: linear-gradient(180deg, #ffc857, var(--accent-2)); color: #1d1203; border-color: transparent; padding: 9px 16px 9px 13px; box-shadow: 0 0 0 1px rgba(var(--accent-2-rgb), 0.55), 0 6px 24px rgba(var(--accent-2-rgb), 0.32); clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px); border-radius: 4px; text-transform: uppercase; letter-spacing: 0.1em; }
.btn.drive:hover { background: linear-gradient(180deg, #ffd983, #ffbe45); }
.top-actions .btn.drive .txt { display: inline; }

/* ---------------- side panels */
.rack, .desk { position: fixed; z-index: 5; top: calc(var(--gap) * 2 + var(--top-h)); bottom: var(--gap); border-radius: 18px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.rack { left: var(--gap); width: var(--rack-w); }
.desk { right: var(--gap); width: var(--desk-w); }
.scroll { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.16) transparent; }
.scroll::-webkit-scrollbar { width: 8px; }
.scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
.scroll::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.26); border: 2px solid transparent; background-clip: padding-box; }

/* rack */
.rack-head { padding: 14px 14px 12px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.label { font-family: var(--font-display); font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.search { width: 100%; background: rgba(0, 0, 0, 0.28); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 9px 11px; color: var(--fg); transition: border-color .16s, box-shadow .16s; }
.search::placeholder { color: var(--faint); }
.search:focus { outline: none; border-color: rgba(var(--accent-rgb), 0.6); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.14); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; transition: color .14s, background .14s, border-color .14s; }
.chip:hover { color: var(--fg); border-color: var(--line-2); }
.chip[aria-pressed="true"] { background: rgba(var(--accent-rgb), 0.16); color: var(--accent); border-color: rgba(var(--accent-rgb), 0.55); }
.featured { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.feat-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.feat { position: relative; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: var(--r-sm); padding: 8px 9px 8px 11px; display: grid; gap: 1px; overflow: hidden; transition: border-color .16s, background .16s; }
.feat::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--accent-2); opacity: 0.75; }
.feat b { font-family: var(--font-display); font-size: 13px; letter-spacing: 0.01em; }
.feat span { color: var(--muted); font-size: 11px; line-height: 1.25; }
.feat:hover { border-color: rgba(var(--accent-2-rgb), 0.6); background: var(--card-hi); }
.carlist { list-style: none; margin: 0; padding: 6px 8px 10px; display: grid; gap: 2px; }
.caritem { position: relative; width: 100%; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 7px 9px; border-radius: var(--r-sm); border: 1px solid transparent; background: transparent; text-align: left; transition: background .14s, border-color .14s; }
.caritem:hover { background: var(--card); }
.caritem[aria-current="true"] { background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.16), rgba(var(--accent-rgb), 0.04)); border-color: rgba(var(--accent-rgb), 0.45); }
.caritem[aria-current="true"]::before { content: ""; position: absolute; left: -1px; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.9); }
.caritem svg { width: 44px; height: 22px; color: var(--faint); }
.caritem[aria-current="true"] svg { color: var(--accent); }
.caritem .nm { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.caritem .sub { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.caritem .hp { font-family: var(--font-display); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.era { font-size: 9.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 1px 5px; border-radius: 4px; margin-left: 5px; vertical-align: 1px; font-family: var(--font-display); }
.era.classic { background: rgba(var(--accent-2-rgb), 0.16); color: var(--accent-2); }
.era.import { background: rgba(var(--accent-rgb), 0.14); color: var(--accent); }

/* ---------------- overlay on the stage */
.overlay { position: fixed; z-index: 4; top: calc(var(--gap) * 2 + var(--top-h)); left: calc(var(--gap) * 2 + var(--rack-w)); right: calc(var(--gap) * 2 + var(--desk-w)); bottom: var(--gap); pointer-events: none; container-type: inline-size; container-name: stage; }
.overlay > * { pointer-events: auto; }
.stage-top { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
.stage-top > * { pointer-events: auto; }
.car-title { min-width: 0; padding: 12px 16px 12px; border-radius: 16px; background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--line); box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.07); max-width: min(460px, 100%); }
.car-title h1 { margin: 0; font-family: var(--font-display); font-size: clamp(20px, 2.1vw, 28px); line-height: 1.05; letter-spacing: 0.02em; text-wrap: balance; text-transform: uppercase; }
.car-title p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
.verdict { display: inline-flex; align-items: stretch; margin-top: 10px; background: rgba(0, 0, 0, 0.3); border-radius: 8px; border: 1px solid rgba(var(--accent-2-rgb), 0.4); font-family: var(--font-display); overflow: hidden; max-width: 100%; }
.verdict .pk { background: var(--plate-green); color: #fff; font-size: 9px; font-weight: 700; display: grid; place-items: center; padding: 0 6px; letter-spacing: 0.04em; }
.verdict .vt { padding: 4px 10px 3px; display: grid; min-width: 0; }
.verdict .vt b { font-size: 13.5px; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--accent-2); }
.verdict .vt span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-body); }
.view-tools { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.seg { display: inline-flex; background: var(--glass); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 10px; border-radius: 9px; font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; transition: color .14s, background .14s; }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: rgba(var(--accent-rgb), 0.16); color: var(--accent); box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb), 0.5); }
.stage-bottom { position: absolute; left: 252px; right: 0; bottom: 0; pointer-events: none; display: flex; justify-content: flex-end; }
.statstrip { pointer-events: auto; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; max-width: 780px; width: 100%; }
.stat { position: relative; background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px 8px; min-width: 0; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.06); overflow: hidden; }
.stat::after { content: ""; position: absolute; left: 10px; right: 10px; top: 0; height: 2px; border-radius: 2px; background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.9), rgba(var(--accent-rgb), 0)); }
.stat .k { font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-family: var(--font-display); font-weight: 600; white-space: nowrap; }
.stat .v { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .v small { font-size: 11px; color: var(--muted); font-weight: 600; margin-left: 3px; }
.stat .d { font-size: 11px; font-family: var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--faint); }
.d.up { color: var(--good); } .d.down { color: var(--bad); }
body.solid .stat, body.solid .car-title { -webkit-backdrop-filter: none; backdrop-filter: none; }

/* sound lab */
.soundlab { position: absolute; left: 0; bottom: 0; width: 240px; border-radius: 16px; z-index: 2; }
.sl-head { display: flex; align-items: center; justify-content: space-between; padding: 9px 10px 6px 14px; gap: 8px; }
.sl-head .label { color: var(--accent); display: flex; align-items: center; gap: 7px; }
.sl-head .label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
.soundlab[data-live="true"] .sl-head .label::before { background: var(--good); box-shadow: 0 0 10px var(--good); }
.sl-body { padding: 0 10px 10px; display: grid; gap: 6px; }
.soundlab[data-open="false"] .sl-body { display: none; }
.tacho { width: 100%; height: 118px; display: block; }
.sl-row { display: flex; gap: 6px; }
.sl-row .btn { flex: 1; padding: 8px 6px; font-size: 12.5px; }
.rev { touch-action: none; user-select: none; -webkit-user-select: none; }
.rev:active, .rev.held { background: var(--accent-2) !important; color: #1d1203 !important; border-color: transparent !important; box-shadow: 0 0 22px rgba(var(--accent-2-rgb), 0.5); }
.sl-note { font-size: 11px; color: var(--muted); line-height: 1.35; margin: 0; }
.vol { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); font-family: var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; }

/* range inputs */
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; background: transparent; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.85), rgba(var(--accent-rgb), 0.25)); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.85), rgba(var(--accent-rgb), 0.25)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.7); }
input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.7); }

/* ---------------- desk */
.tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; flex: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; flex: 1; display: grid; justify-items: center; gap: 3px; border: 0; background: transparent; color: var(--muted); padding: 7px 6px 9px; font-family: var(--font-display); font-weight: 600; font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; border-radius: 10px 10px 0 0; transition: color .14s, background .14s; }
.tab svg { width: 18px; height: 18px; }
.tab:hover { color: var(--fg); background: var(--card); }
.tab[aria-selected="true"] { color: var(--accent); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 14%; right: 14%; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.9); }
.panel { flex: 1; min-height: 0; padding: 14px 14px 28px; display: grid; gap: 12px; align-content: start; }
.panel.in > * { animation: rise .22s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 13px; display: grid; gap: 11px; min-width: 0; }
.card h3 { margin: 0; font-family: var(--font-display); font-size: 14.5px; letter-spacing: 0.06em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.card h3::before { content: ""; width: 3px; height: 13px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.7); flex: none; }
.group { display: grid; gap: 7px; min-width: 0; }
.group > .label { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.group > .label em { font-style: normal; color: var(--fg); letter-spacing: 0.02em; text-transform: none; font-family: var(--font-body); font-weight: 600; font-size: 12px; text-align: right; }
.opts { display: flex; flex-wrap: wrap; gap: 5px; }
.opt { border: 1px solid var(--line); background: rgba(0, 0, 0, 0.22); color: var(--fg); border-radius: var(--r-sm); padding: 7px 10px; font-size: 12.5px; font-weight: 600; text-align: left; display: grid; gap: 1px; transition: border-color .14s, background .14s, box-shadow .14s; }
.opt small { color: var(--muted); font-weight: 500; font-size: 11px; }
.opt:hover { border-color: var(--line-2); background: rgba(255, 255, 255, 0.05); }
.opt[aria-pressed="true"] { border-color: rgba(var(--accent-rgb), 0.7); background: rgba(var(--accent-rgb), 0.11); box-shadow: 0 0 16px rgba(var(--accent-rgb), 0.12), inset 0 0 0 1px rgba(var(--accent-rgb), 0.18); }
.opt[aria-pressed="true"] small { color: #b7d8e2; }
.opt:disabled { opacity: 0.38; cursor: not-allowed; }
.toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tog { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid var(--line); background: rgba(0, 0, 0, 0.22); border-radius: var(--r-sm); padding: 8px 10px; font-size: 12.5px; font-weight: 600; text-align: left; transition: border-color .14s, background .14s; }
.tog:hover { border-color: var(--line-2); }
.tog i { width: 30px; height: 16px; border-radius: 9px; background: rgba(255, 255, 255, 0.1); position: relative; flex: none; transition: background .16s, box-shadow .16s; }
.tog i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: transform .16s, background .16s; }
.tog[aria-pressed="true"] { border-color: rgba(var(--accent-rgb), 0.6); background: rgba(var(--accent-rgb), 0.08); }
.tog[aria-pressed="true"] i { background: rgba(var(--accent-rgb), 0.35); box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.4); }
.tog[aria-pressed="true"] i::after { transform: translateX(14px); background: #fff; }
.swatches { display: flex; flex-wrap: wrap; gap: 7px; }
.sw { width: 28px; height: 28px; border-radius: 9px; border: 1px solid rgba(255, 255, 255, 0.22); padding: 0; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), inset 0 -6px 10px rgba(0, 0, 0, 0.22); transition: transform .1s, box-shadow .14s; }
.sw:hover { transform: scale(1.08); }
.sw[aria-pressed="true"] { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 0 0 2px var(--bg), 0 0 0 4px var(--accent), 0 0 16px rgba(var(--accent-rgb), 0.5); }
.sw.none { background: repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.05) 0 4px, rgba(255, 255, 255, 0.16) 4px 8px); }
.colorpick { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.colorpick input { width: 34px; height: 28px; border: 1px solid var(--line-2); background: none; padding: 0; border-radius: 8px; cursor: pointer; }
.textin { width: 100%; background: rgba(0, 0, 0, 0.28); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 9px 11px; font-family: var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; }
.textin:focus { outline: none; border-color: rgba(var(--accent-rgb), 0.6); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.14); }
.model-card .opts { margin-top: 2px; }

.engine-now { display: grid; gap: 9px; background: linear-gradient(160deg, rgba(var(--accent-rgb), 0.1), rgba(255, 255, 255, 0.03) 55%); border-color: rgba(var(--accent-rgb), 0.28); }
.engine-now .row1 { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.engine-now h3 { font-size: 19px; letter-spacing: 0.03em; text-transform: none; }
.engine-now h3::before { display: none; }
.engine-now p { margin: 0; color: var(--muted); font-size: 12.5px; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 12.5px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-weight: 600; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; white-space: nowrap; font-family: var(--font-display); }
.pill.f0 { background: rgba(63, 227, 145, 0.14); color: var(--good); }
.pill.f1 { background: rgba(var(--accent-rgb), 0.14); color: var(--accent); }
.pill.f2 { background: rgba(var(--accent-2-rgb), 0.16); color: var(--warn); }
.pill.f3 { background: rgba(255, 93, 108, 0.16); color: var(--bad); }
.elist { display: grid; gap: 4px; }
.eitem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 9px 11px; border-radius: var(--r-sm); border: 1px solid var(--line); background: rgba(0, 0, 0, 0.2); text-align: left; width: 100%; transition: border-color .14s, background .14s; }
.eitem:hover { border-color: var(--line-2); background: rgba(255, 255, 255, 0.05); }
.eitem[aria-current="true"] { border-color: rgba(var(--accent-rgb), 0.65); background: rgba(var(--accent-rgb), 0.09); }
.eitem .en { font-weight: 700; font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.eitem .ed { color: var(--muted); font-size: 11.5px; grid-column: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.eitem .ep { font-family: var(--font-display); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.eitem .ep small { color: var(--muted); font-size: 11px; }
.eitem .er { grid-column: 2; grid-row: 2; justify-self: end; }
.stock-tag { color: var(--accent-2); font-size: 9.5px; font-weight: 700; letter-spacing: 0.1em; margin-left: 6px; font-family: var(--font-display); }

.compare { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.compare th { text-align: left; color: var(--muted); font-weight: 600; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; padding: 0 0 6px; font-family: var(--font-display); }
.compare th:not(:first-child), .compare td:not(:first-child) { text-align: right; }
.compare td { padding: 5px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.compare td:first-child { color: var(--muted); }
.compare td.b { font-weight: 700; }
.compare td.dd { font-family: var(--font-display); font-size: 12px; padding-left: 8px; }
.chartbox { position: relative; }
.chartbox canvas { width: 100%; height: 200px; display: block; }
.legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.pc { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; font-size: 13px; }
.pc li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start; }
.pc li::before { font-family: var(--font-display); font-weight: 700; line-height: 1.35; width: 18px; height: 18px; border-radius: 6px; display: grid; place-items: center; font-size: 13px; }
.pc.pro li::before { content: "+"; color: var(--good); background: rgba(63, 227, 145, 0.14); }
.pc.con li::before { content: "\2212"; color: var(--bad); background: rgba(255, 93, 108, 0.14); }
.pc.info li::before { content: "i"; color: var(--accent); background: rgba(var(--accent-rgb), 0.14); font-style: italic; }
.scores { display: grid; gap: 9px; }
.score { display: grid; grid-template-columns: 112px minmax(0, 1fr) 34px; align-items: center; gap: 8px; font-size: 12.5px; }
.bar { height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 4px; position: relative; }
.bar b { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.55), var(--accent)); border-radius: 4px; box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.5); }
.bar s { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--stock); text-decoration: none; border-radius: 2px; }
.fitbox { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.fitcell { background: rgba(0, 0, 0, 0.22); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px; display: grid; gap: 4px; }
.fitcell .k { font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-family: var(--font-display); }
.fitcell .v { font-family: var(--font-display); font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.meter { height: 8px; border-radius: 5px; background: linear-gradient(90deg, var(--good), var(--accent) 30%, var(--warn) 62%, var(--bad)); position: relative; margin: 4px 0; }
.meter b { position: absolute; top: -5px; width: 4px; height: 18px; background: #fff; border-radius: 2px; box-shadow: 0 0 0 2px rgba(5, 7, 11, 0.9), 0 0 12px rgba(255, 255, 255, 0.6); }
.hint { color: var(--muted); font-size: 12px; margin: 0; }

/* ---------------- modal */
.modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(3, 5, 8, 0.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; animation: fade .16s ease; }
body.solid .modal { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(3, 5, 8, 0.78); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal-box { width: min(760px, 100%); max-height: calc(100% - 20px); overflow: auto; background: var(--glass-hi); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--line-2); border-radius: 20px; box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.08); display: grid; animation: pop .2s ease; }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(0.985); } to { opacity: 1; transform: none; } }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); gap: 10px; }
.modal-head h2 { margin: 0; font-family: var(--font-display); font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; }
.modal-body { padding: 16px; display: grid; gap: 14px; min-width: 0; }
.dragcv { width: 100%; height: 170px; border-radius: var(--r); display: block; border: 1px solid var(--line); }
.res { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.photo { width: 100%; border-radius: var(--r); border: 1px solid var(--line); display: block; }
.buildrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; align-items: center; padding: 9px 11px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-sm); }
.buildrow b { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.buildrow span { color: var(--muted); font-size: 12px; grid-column: 1; }
textarea.code { width: 100%; min-height: 70px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 9px; font-family: var(--font-mono); font-size: 11px; color: var(--fg); resize: vertical; }
select.search { appearance: auto; }

.toast { position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 24px); opacity: 0; background: var(--glass-hi); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); color: var(--fg); border: 1px solid rgba(var(--accent-rgb), 0.45); padding: 10px 16px 10px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; z-index: 40; transition: transform .25s ease, opacity .25s ease; max-width: calc(100% - 32px); text-align: center; pointer-events: none; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 24px rgba(var(--accent-rgb), 0.16); }
.toast::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); margin-right: 9px; vertical-align: 1px; }
.toast.show { transform: translate(-50%, 0); opacity: 1; }

/* ---------------- start-up screen */
.loading { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(80% 70% at 50% 45%, #0d131c, #05070b 70%); z-index: 3; transition: opacity .5s; }
.loading.hide { opacity: 0; pointer-events: none; }
.loading .ld { display: grid; gap: 16px; justify-items: center; color: var(--muted); font-family: var(--font-display); letter-spacing: 0.22em; text-transform: uppercase; font-size: 11.5px; text-align: center; padding: 20px; }
.ld-ring { width: 86px; height: 86px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.08); border-top-color: var(--accent); border-right-color: rgba(var(--accent-rgb), 0.35); animation: spin 0.9s linear infinite; box-shadow: 0 0 34px rgba(var(--accent-rgb), 0.18); }
@keyframes spin { to { transform: rotate(360deg); } }
.loading .bar2 { width: 180px; height: 3px; background: rgba(255, 255, 255, 0.08); border-radius: 2px; overflow: hidden; }
.loading .bar2 i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, transparent, var(--accent)); animation: ld 1s ease-in-out infinite alternate; }
@keyframes ld { from { transform: translateX(-60%); } to { transform: translateX(210%); } }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

#stripHolder { display: none; }
@container stage (max-width: 1060px) {
  .statstrip { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 440px; }
}
@container stage (max-width: 700px) {
  .stat .v { font-size: 19px; }
  .stat { padding: 8px 9px 7px; }
  .car-title { max-width: 58%; }
}
@container stage (max-width: 560px) {
  .stage-bottom { left: 0; bottom: auto; top: 118px; justify-content: flex-start; }
  .statstrip { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 250px; }
  .stage-top { flex-direction: column; }
  .view-tools { align-items: flex-start; }
  .car-title { max-width: 100%; }
}

/* ---------------- narrower windows */
@media (max-width: 1320px) {
  :root { --rack-w: 264px; --desk-w: 368px; }
  .brand-text span { display: none; }
}
@media (max-width: 1100px) {
  .top-actions .btn:not(.drive) .txt { display: none; }
}
@media (max-width: 1020px) {
  :root { --desk-w: 350px; }
  .rack { display: none; }
  .overlay { left: var(--gap); }
}
@media (max-height: 640px) and (min-width: 761px) {
  .sl-note { display: none; }
  .tacho { height: 96px; }
}
/* phone: a normal scrolling page, stage on top */
@media (max-width: 760px) {
  :root { --top-h: 50px; }
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; display: flex; flex-direction: column; }
  .top { position: sticky; top: 0; left: 0; right: 0; border-radius: 0; border-width: 0 0 1px; order: 0; padding-top: env(safe-area-inset-top, 0px); height: calc(var(--top-h) + env(safe-area-inset-top, 0px)); background: rgba(8, 11, 16, 0.92); z-index: 8; }
  .top::after { left: 0; right: 0; }
  .brand-text { display: none; }
  .stage-wrap { position: relative; inset: auto; height: 56vh; min-height: 320px; flex: none; order: 1; }
  .overlay { position: absolute; inset: 10px; top: calc(10px + var(--top-h) + env(safe-area-inset-top, 0px)); height: calc(56vh - 20px); min-height: 300px; bottom: auto; z-index: 4; }
  #stripHolder { display: block; padding: 10px 12px 0; order: 2; }
  .desk { position: static; width: auto; border-radius: 0; border-width: 1px 0 0; order: 3; overflow: visible; background: var(--panel); -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; margin-top: 10px; }
  .desk .scroll { overflow: visible; }
  .stage-bottom { position: static; padding: 0; }
  .statstrip { max-width: none; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stat { background: var(--panel-2); -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; }
  .soundlab { width: 206px; }
  .tacho { height: 104px; }
  .view-tools .seg button { padding: 5px 7px; }
  .car-title { padding: 9px 12px; max-width: 62%; }
  .car-title h1 { font-size: 18px; }
  .verdict .vt b { font-size: 12px; white-space: normal; line-height: 1.15; }
  .verdict .vt span { white-space: normal; line-height: 1.25; }
  .tabs { position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); background: var(--panel); z-index: 4; }
  .top-actions .txt { display: none; }
  .vignette { display: none; }
}

/* ---------------- drive mode */
body.driving { overflow: hidden; }
body.driving .stage-wrap { position: fixed; inset: 0; z-index: 25; height: auto; }
body.driving .top, body.driving .rack, body.driving .desk, body.driving .overlay, body.driving #stripHolder, body.driving .stage > .loading, body.driving .vignette { display: none; }
.dv { position: absolute; inset: 0; z-index: 6; pointer-events: none; font-family: var(--font-display); color: var(--fg); }
.dv[hidden] { display: none !important; }
.dv-top { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-top: max(14px, env(safe-area-inset-top, 0px)); padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
.dv-panel { background: var(--glass); border: 1px solid var(--line); border-radius: 16px; padding: 11px 13px; -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); min-width: 220px; display: grid; gap: 8px; pointer-events: auto; box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.07); }
.dv-area b { display: block; font-size: 15px; letter-spacing: 0.06em; line-height: 1.2; text-transform: uppercase; }
.dv-area span { font-size: 12px; color: var(--muted); font-family: var(--font-body); }
.dv-lap, .dv-drift { display: grid; gap: 2px; border-top: 1px solid var(--line); padding-top: 7px; }
.dv-row { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; font-size: 11px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
.dv-row .v { color: var(--fg); font-variant-numeric: tabular-nums; letter-spacing: 0; text-transform: none; font-size: 13px; }
.dv-row.big .v { font-size: 20px; font-weight: 700; }
.dv-row b { color: var(--fg); }
.dv-delta.good { color: var(--good); } .dv-delta.bad { color: var(--bad); }
.dv-flag { font-size: 11px; color: var(--bad); text-transform: uppercase; letter-spacing: 0.1em; }
.dv-center { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
.dv-angle { background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 4px 12px 7px; display: grid; justify-items: center; -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
.dv-angle.live { border-color: rgba(var(--accent-2-rgb), 0.6); box-shadow: 0 0 26px rgba(var(--accent-2-rgb), 0.22); }
.dv-angletxt { display: flex; gap: 10px; align-items: baseline; margin-top: -4px; }
.dv-deg { font-size: 22px; color: var(--accent-2); font-variant-numeric: tabular-nums; }
.dv-mult { font-size: 14px; color: var(--accent); }
.dv-pts { font-size: 18px; font-variant-numeric: tabular-nums; }
.dv-msg { opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .2s; background: var(--glass-hi); border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; font-size: 13.5px; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.dv-msg.show { opacity: 1; transform: none; }
.dv-msg.good { color: var(--good); border-color: rgba(63, 227, 145, 0.5); } .dv-msg.bad { color: var(--bad); border-color: rgba(255, 93, 108, 0.5); }
.dv-tools { display: flex; gap: 6px; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; }
.dv-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--glass); color: var(--fg); border-radius: 11px; padding: 8px 11px; font: 600 12.5px var(--font-display); letter-spacing: 0.05em; -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); transition: border-color .14s, background .14s; }
.dv-btn svg { width: 16px; height: 16px; }
.dv-btn.icon { padding: 8px; }
.dv-btn:hover { border-color: rgba(var(--accent-rgb), 0.7); }
.dv-btn.primary { background: linear-gradient(180deg, #5cecff, var(--accent)); color: var(--accent-ink); border-color: transparent; }
.dv-map { position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px)); border-radius: 50%; box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45); }
.dv-cluster { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: max(8px, env(safe-area-inset-bottom, 0px)); display: grid; justify-items: center; gap: 2px; }
.dv-lamps { display: flex; gap: 6px; font-size: 10px; letter-spacing: 0.1em; }
.dv-lamps span { padding: 2px 7px; border-radius: 5px; background: rgba(5, 7, 11, 0.6); color: rgba(234, 241, 251, 0.28); border: 1px solid transparent; }
.dv-lamps span.on { color: var(--accent-2); background: rgba(var(--accent-2-rgb), 0.16); border-color: rgba(var(--accent-2-rgb), 0.4); }
.dv-lamps span[data-l="mode"] { color: var(--muted); }
.dv-help, .dv-menu { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(3, 5, 8, 0.55); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); pointer-events: auto; padding: 16px; z-index: 3; }
body.solid .dv-help, body.solid .dv-menu { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(3, 5, 8, 0.75); }
.dv-help-in, .dv-menu-in { background: var(--glass-hi); border: 1px solid var(--line-2); border-radius: 20px; padding: 16px; width: min(580px, 100%); max-height: calc(100% - 16px); overflow: auto; display: grid; gap: 12px; font-family: var(--font-body); box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.08); scrollbar-width: thin; }
.dv-help h3, .dv-menu h3 { margin: 0; font-family: var(--font-display); font-size: 18px; letter-spacing: 0.1em; text-transform: uppercase; }
.dv-help p { margin: 0; color: var(--muted); font-size: 12.5px; }
.dv-keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; align-items: center; }
.dv-keys > span:nth-child(odd) { white-space: nowrap; }
kbd { display: inline-block; min-width: 22px; text-align: center; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--line-2); border-bottom-width: 2px; background: rgba(255, 255, 255, 0.06); font: 600 11.5px var(--font-mono); color: var(--fg); }
.dv-menu-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.dv-build { color: var(--muted); font-size: 12px; text-align: right; }
.dv-sec { display: grid; gap: 6px; }
.dv-lbl { font-family: var(--font-display); font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.dv-opts { display: flex; flex-wrap: wrap; gap: 5px; }
.dv-opts button { border: 1px solid var(--line); background: rgba(0, 0, 0, 0.22); color: var(--fg); border-radius: var(--r-sm); padding: 7px 10px; font-size: 12.5px; font-weight: 600; text-align: left; display: grid; gap: 1px; transition: border-color .14s, background .14s; }
.dv-opts button:hover { border-color: var(--line-2); }
.dv-opts button small { color: var(--muted); font-weight: 500; font-size: 11px; }
.dv-opts button[aria-pressed="true"] { border-color: rgba(var(--accent-rgb), 0.7); background: rgba(var(--accent-rgb), 0.11); }
.dv-wmapwrap { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.dv-wmap { display: block; width: 100%; height: auto; cursor: pointer; }
.dv-vol { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--muted); }
.dv-menu-foot { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.dv-touch { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.dv-touch button { pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; border: 1px solid var(--line-2); background: rgba(5, 7, 11, 0.5); color: var(--fg); border-radius: 16px; font: 700 13px var(--font-display); letter-spacing: 0.06em; }
.dv-touch button.on { background: rgba(var(--accent-rgb), 0.3); border-color: var(--accent); }
.dv-tl { display: flex; gap: 10px; }
.dv-tl button { width: 78px; height: 78px; font-size: 22px; }
.dv-tr { display: flex; gap: 10px; align-items: flex-end; }
.dv-tcol { display: grid; gap: 8px; }
.dv-tr .sm { width: 58px; height: 44px; }
.dv-tr .ped { width: 70px; height: 96px; }
.dv-tr .gas { height: 120px; }
.dv-loading { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(80% 70% at 50% 45%, #0d131c, #05070b 70%); pointer-events: auto; z-index: 4; }
.dv-loading > div { display: grid; gap: 10px; justify-items: center; font-family: var(--font-display); }
.dv-loading b { font-size: 15px; letter-spacing: 0.2em; text-transform: uppercase; }
.dv-loading span { color: var(--muted); font-size: 12px; letter-spacing: 0.04em; }
.dv-loading i { display: block; width: 180px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--accent) 40%, rgba(255, 255, 255, 0.08) 40%); background-size: 200% 100%; animation: dvl 1s linear infinite; }
@keyframes dvl { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@media (max-width: 760px), (pointer: coarse) {
  .dv-panel { min-width: 0; padding: 8px 10px; }
  .dv-row.big .v { font-size: 16px; }
  .dv-cluster { transform: scale(0.66); transform-origin: right bottom; }
  .dv-map { transform: scale(0.72); transform-origin: left top; top: 112px; bottom: auto; }
  .dv-btn span { display: none; }
}
@media (pointer: coarse) {
  .dv-cluster { bottom: 150px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<div class="app" id="app">
  <div class="stage-wrap" id="stageWrap">
    <section class="stage" id="stage" aria-label="3D studio">
      <div id="viewport" class="viewport"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="loading" id="loading"><div class="ld"><div class="ld-ring" aria-hidden="true"></div><span>Warming up the garage</span><div class="bar2"><i></i></div></div></div>
    </section>
  </div>
  <header class="top glass">
    <div class="brand">
      <div class="logo-plate" aria-hidden="true"><span class="pk">PK</span><b>PAK</b><i>SWAP</i></div>
      <div class="brand-text"><strong>PakSwap Studio</strong><span>Engine swaps, sound and specs for every Pakistani car</span></div>
    </div>
    <div class="top-actions">
      <button class="btn" id="btnGarage" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l9-6 9 6v12"/><path d="M7 21v-7h10v7"/><path d="M7 17h10"/></svg><span class="txt">Garage</span></button>
      <button class="btn" id="btnDrag" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V4"/><path d="M4 4h12l-2 4 2 4H4"/></svg><span class="txt">Drag race</span></button>
      <button class="btn" id="btnPhoto" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span class="txt">Build card</span></button>
      <button class="btn icon" id="btnSettings" type="button" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
      <button class="btn drive" id="btnDrive" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.2"/><path d="M12 14.2V21M9.8 12H3.2M14.2 12h6.6"/></svg><span class="txt">Drive</span></button>
    </div>
  </header>
  <aside class="rack glass" id="rack" aria-label="Choose a car"></aside>
  <div class="overlay" id="overlay">
    <div class="stage-top">
      <div class="car-title">
        <h1 id="carTitle">Loading</h1>
        <p id="carSub"></p>
        <div class="verdict" id="verdict" aria-live="polite"><span class="pk">PK</span><span class="vt"><b>Factory spec</b><span>Pick a swap to begin</span></span></div>
      </div>
      <div class="view-tools">
        <div class="seg" role="group" aria-label="Camera">
          <button type="button" data-view="front" aria-pressed="true">3/4</button>
          <button type="button" data-view="side">Side</button>
          <button type="button" data-view="rear">Rear</button>
          <button type="button" data-view="top">Top</button>
          <button type="button" data-view="engine">Engine</button>
        </div>
        <div class="seg" role="group" aria-label="Studio">
          <button type="button" id="tXray" aria-pressed="false">X-ray</button>
          <button type="button" id="tNight" aria-pressed="true">Night</button>
          <button type="button" id="tSpin" aria-pressed="false">Spin</button>
        </div>
      </div>
    </div>
    <div class="soundlab glass" id="soundLab" data-open="true" data-live="false">
      <div class="sl-head">
        <span class="label">Sound lab</span>
        <div style="display:flex;gap:6px">
          <button class="btn icon ghost" type="button" id="slToggle" aria-label="Collapse sound lab" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 15l6-6 6 6"/></svg></button>
        </div>
      </div>
      <div class="sl-body">
        <canvas class="tacho" id="tacho" aria-label="Tachometer"></canvas>
        <div class="sl-row">
          <button class="btn primary" type="button" id="slStart">Start engine</button>
        </div>
        <div class="sl-row">
          <button class="btn rev" type="button" id="slRev" aria-label="Hold to rev">Hold to rev</button>
          <button class="btn" type="button" id="slShow">Rev show</button>
        </div>
        <div class="sl-row">
          <button class="btn" type="button" id="slLaunch">Launch 0-200</button>
          <button class="btn" type="button" id="slAB" aria-pressed="false">Hear stock</button>
        </div>
        <label class="vol" for="vol">Vol <input id="vol" type="range" min="0" max="1" step="0.01" value="0.75"></label>
        <p class="sl-note" id="slNote">Tip: hold Space to rev, press E to start or stop.</p>
      </div>
    </div>
    <div class="stage-bottom"><div class="statstrip" id="statStrip"></div></div>
  </div>
  <div id="stripHolder"></div>
  <aside class="desk glass" id="desk" aria-label="Customise">
    <nav class="tabs" id="tabs" role="tablist" aria-label="Customisation sections"></nav>
    <div class="panel scroll" id="panel" role="tabpanel"></div>
  </aside>
  <div class="modal" id="modal" hidden><div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle"></h2><button class="btn icon" type="button" id="modalClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="modal-body" id="modalBody"></div></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
